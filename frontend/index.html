<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Local Hawk AI - Results</title>
  <script>window.MAP_API_BASE = "__MAP_API_BASE__";</script>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #151c25;
      --surface-2: #1e2632;
      --border: #3a4759;
      --text: #e6edf3;
      --muted: #a7b3c4;
      --accent: #34d399;
      --accent-dim: rgba(52,211,153,.14);
      --blue: #60a5fa;
      --amber: #fbbf24;
      --red: #f87171;
      --purple: #c084fc;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--sans);
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    /* Top bar */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      padding: 14px 20px;
      background: rgba(11,15,20,0.92);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-dot {
      width:10px; height:10px; border-radius:50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-dim);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.45 } }
    .topbar h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .1px; }
    .subtitle { margin: 3px 0 0 0; font-size: 12.5px; color: var(--muted); max-width: 60ch; }
    .topbar-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    .conn-status { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .2s; }
    .status-dot.ok { background: var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
    .status-dot.err { background: var(--red); box-shadow:0 0 0 3px rgba(248,113,113,.15); }

    .admin-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn {
      font-family: var(--sans); font-size: 12.5px; font-weight: 600;
      padding: 7px 13px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      transition: background .15s, border-color .15s, opacity .15s;
    }
    .btn:hover { border-color: var(--muted); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-info { color: var(--blue); border-color: rgba(96,165,250,.35); }
    .btn-info:hover { background: rgba(96,165,250,.12); }
    .btn-danger { color: var(--red); border-color: rgba(248,113,113,.35); }
    .btn-danger:hover { background: rgba(248,113,113,.12); }

    .action-status { font-size: 12.5px; padding: 0 20px; min-height: 20px; }
    .action-status.success { color: var(--accent); }
    .action-status.error { color: var(--red); }
    #notifications:empty { display: none; }

    /* Board layout */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 18px;
      padding: 18px 20px 28px;
      align-items: start;
    }
    .col-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .col-title {
      font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
    }
    .col-title::before { content: ''; width: 8px; height: 8px; border-radius: 2px; display:inline-block; }
    .col-title.tent::before { background: var(--amber); }
    .col-title.mannequin::before { background: var(--purple); }
    .col-title.gs::before { background: var(--blue); }
    .count-badge {
      font-family: var(--mono); font-size: 11.5px; color: var(--muted);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 9px; min-width: 20px; text-align: center;
    }

    .log { max-height: calc(100vh - 200px); overflow-y: auto; padding-right: 4px; }

    .card {
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); padding: 12px;
      margin-bottom: 12px;
      transition: box-shadow .15s, border-color .15s;
    }
    .card.highlight {
      border-color: rgba(52,211,153,.5);
      box-shadow: 0 0 0 1px rgba(52,211,153,.15), 0 4px 16px rgba(52,211,153,.08);
    }
    .card .timestamp {
      color: var(--muted); font-size: 11.5px; font-family: var(--mono);
      display:flex; align-items:center; gap:5px; margin-bottom: 8px;
    }
    .card .timestamp::before { content: '⏱'; font-size: 11px; }

    canvas.entry-canvas {
      width: 100%; height: auto; display: block;
      border-radius: 7px; border: 1px solid var(--border); background: #06090c;
    }

    .meta { margin-top: 10px; font-size: 13px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 650; letter-spacing: .1px;
      border: 1px solid transparent; white-space: nowrap;
    }
    .chip-score-high { background: rgba(52,211,153,.12); color: var(--accent); border-color: rgba(52,211,153,.35); }
    .chip-score-mid  { background: rgba(251,191,36,.12); color: var(--amber); border-color: rgba(251,191,36,.35); }
    .chip-score-low  { background: rgba(248,113,113,.12); color: var(--red); border-color: rgba(248,113,113,.35); }
    .chip-source     { background: rgba(96,165,250,.12); color: var(--blue); border-color: rgba(96,165,250,.35); }
    .chip-id         { background: var(--surface-2); color: var(--muted); border-color: var(--border); font-family: var(--mono); }
    .chip-dup        { background: rgba(251,191,36,.14); color: var(--amber); border-color: rgba(251,191,36,.4); }
    .chip-timing     { background: rgba(192,132,252,.12); color: var(--purple); border-color: rgba(192,132,252,.35); font-family: var(--mono); }

    .gemini-reason {
      font-size: 12.5px; line-height: 1.4; max-height: 5.5em; overflow: auto;
      margin: 8px 0 0 0; padding: 8px 10px;
      background: var(--surface-2); border-left: 2px solid var(--blue); border-radius: 0 6px 6px 0;
      color: var(--text);
    }
    .gemini-reason::before { content: '"Gemini — '; color: var(--muted); }
    .gemini-reason::after { content: '"'; color: var(--muted); }

    .loc-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      margin-top: 10px; padding: 8px; background: var(--surface-2); border-radius: 8px;
    }
    .loc-grid .k { display: block; font-size: 9.5px; color: var(--muted); letter-spacing: .07em; }
    .loc-grid .v { display: block; font-family: var(--mono); font-size: 12.5px; margin-top: 1px; }

    details.assignment {
      margin-top: 10px; font-size: 12px;
    }
    details.assignment summary {
      cursor: pointer; color: var(--muted); font-size: 11.5px;
      font-weight: 600; letter-spacing: .03em; user-select: none;
    }
    details.assignment summary:hover { color: var(--text); }
    details.assignment pre {
      font-size: 11.5px; font-family: var(--mono); line-height: 1.35;
      max-height: 10em; overflow: auto; margin: 6px 0 0 0; white-space: pre-wrap;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px;
    }

    .empty {
      color: var(--muted); text-align: center; font-size: 12.5px;
      border: 1px dashed var(--border); border-radius: 10px; padding: 22px 10px;
    }
    .skeleton { color: var(--muted); text-align:center; font-size:12.5px; padding: 22px 10px; }

    /* GS column */
    .gs-controls {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); margin-bottom: 10px;
    }
    .control { display: flex; align-items: center; gap: 6px; }
    .control select {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 5px; padding: 4px 6px; font-size: 12px; font-family: var(--sans);
    }
    .control.checkbox { user-select: none; cursor: pointer; }
    .control input[type="checkbox"] { accent-color: var(--accent); }

    .gs-card {
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 12px;
    }
    .gs-legend {
      margin-top: 10px; font-size: 12px; color: var(--muted);
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    }
    .gs-legend .legend-title { font-weight: 650; color: var(--text); margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
    .gs-legend .legend-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .legend-swatch { display: inline-block; width: 22px; border-top: 2px solid; margin-right: 6px; vertical-align: middle; }

    .gs-loc {
      margin-top: 12px; padding: 12px; background: var(--surface-2); border-radius: 8px;
      border: 1px solid var(--border);
    }
    .gs-loc .label-sm { font-size: 10.5px; color: var(--muted); font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .gs-loc .hero-row { display: flex; gap: 26px; margin-top: 8px; flex-wrap: wrap; }
    .gs-loc .hero-val { font-family: var(--mono); font-size: 28px; font-weight: 650; color: var(--text); line-height: 1; }
    .gs-loc .hero-key { font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: .05em; }
    .gs-loc .alt-row { font-size: 12px; margin-top: 8px; color: var(--muted); font-family: var(--mono); }

    @media (max-width: 720px) {
      .topbar { padding: 12px 14px; }
      .board { padding: 14px; grid-template-columns: 1fr; }
      .gs-loc .hero-val { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Local Hawk AI — Live Results</h1>
      </div>
      <p class="subtitle">Most recent tent &amp; mannequin detections (cloud push or local GD backup), plus the latest raw ground-station pull.</p>
    </div>
    <div class="topbar-right">
      <div class="conn-status">
        <span class="status-dot" id="sse-dot"></span>
        <span id="sse-label">connecting…</span>
      </div>
      <div class="admin-actions">
        <button id="btn-check-cloud" class="btn btn-info">Check Cloud Status</button>
        <button id="btn-clear-cloud" class="btn btn-danger">Clear Cloud Server</button>
        <button id="btn-clear-exports" class="btn btn-danger">Delete Local Saved Images</button>
      </div>
    </div>
  </div>
  <div id="admin-status" class="action-status"></div>
  <div id="notifications"></div>

  <main class="board">
    <section aria-label="Tent detections">
      <div class="col-head">
        <span class="col-title tent">Tent</span>
        <span class="count-badge" id="count-tent">0</span>
      </div>
      <div class="log" id="log-tent"><div class="skeleton">Loading…</div></div>
    </section>

    <section aria-label="Mannequin detections">
      <div class="col-head">
        <span class="col-title mannequin">Mannequin</span>
        <span class="count-badge" id="count-mannequin">0</span>
      </div>
      <div class="log" id="log-mannequin"><div class="skeleton">Loading…</div></div>
    </section>

    <section aria-label="Ground station pulls">
      <div class="col-head">
        <span class="col-title gs">Ground Station</span>
        <span class="count-badge" id="count-gs">0</span>
      </div>
      <div class="gs-controls">
        <label class="control">
          <span>Grid</span>
          <select id="gs-grid-spacing">
            <option value="5">5 m</option>
            <option value="10" selected>10 m</option>
            <option value="25">25 m</option>
            <option value="50">50 m</option>
            <option value="100">100 m</option>
          </select>
        </label>
        <label class="control checkbox">
          <input id="gs-show-crosshair" type="checkbox" checked />
          <span>Crosshair</span>
        </label>
      </div>
      <div class="log" id="gs-panel"><div class="skeleton">Loading…</div></div>
    </section>
  </main>

<script>
const API_BASE = (window.MAP_API_BASE && window.MAP_API_BASE.indexOf('http') === 0) ? window.MAP_API_BASE : '';

async function fetchBest() {
  try {
    const res = await fetch(`${API_BASE}/api/best`);
    if (!res.ok) throw new Error('failed');
    return await res.json();
  } catch (e) { console.error(e); return null; }
}
  function fmtTs(ts) {
    if (!ts) return 'N/A';
    const d = new Date(ts);
    return d.toLocaleString();
  }
  function fmtDuration(ms) {
    const totalSecs = Math.max(0, ms / 1000);
    const mins = Math.floor(totalSecs / 60);
    const secs = (totalSecs - mins * 60).toFixed(1);
    return `${mins}:${secs.padStart(4, '0')}`;
  }
  // Track duplicate counts by signature (assignment_id|bbox|score)
  const duplicateCounts = {};
  function _sigFromParts(aid, bbox, score) {
    try {
      const b = (bbox && Array.isArray(bbox)) ? bbox.join(',') : '';
      const s = (typeof score === 'number') ? Math.round(score * 1e6) : ('' + score);
      return `${aid}|${b}|${s}`;
    } catch (e) { return null; }
  }
  function sigFromData(data) {
    try {
      const aid = data.assignment_id || (data.assignment && data.assignment.id) || '';
      const bbox = data.bbox || [];
      const score = (data.score !== undefined ? data.score : null);
      return _sigFromParts(aid, bbox, score);
    } catch (e) { return null; }
  }

  function scoreChipClass(score) {
    if (typeof score !== 'number' || !Number.isFinite(score)) return 'chip-id';
    if (score >= 0.7) return 'chip-score-high';
    if (score >= 0.4) return 'chip-score-mid';
    return 'chip-score-low';
  }

  function updateCount(labelName, n) {
    const el = document.getElementById(`count-${labelName}`);
    if (el) el.textContent = String(n);
  }

  // GS overlay settings
  let GS_GRID_SPACING_METERS = 10; // configurable grid spacing
  let GS_SHOW_CROSSHAIR = true;
  const GS_DEFAULT_FOV_X_RAD = 0.3069;
  const GS_DEFAULT_FOV_Y_RAD = 0.2046;

  function asFiniteNumber(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  function getAssignmentImageTelemetry(assignment) {
    // Newer schema: assignment.image.telemetry.gps.latitude/longitude
    // Legacy schema fallback: assignment.telemetry.latitude/longitude
    const imgTelem = assignment && assignment.image && assignment.image.telemetry ? assignment.image.telemetry : null;
    const legacyTelem = assignment && assignment.telemetry ? assignment.telemetry : null;
    const telemetry = imgTelem || legacyTelem;
    if (!telemetry) return null;

    const lat = asFiniteNumber(telemetry.gps && telemetry.gps.latitude !== undefined ? telemetry.gps.latitude : telemetry.latitude);
    const lon = asFiniteNumber(telemetry.gps && telemetry.gps.longitude !== undefined ? telemetry.gps.longitude : telemetry.longitude);
    const altitude = asFiniteNumber(telemetry.altitude);
    return { lat, lon, altitude };
  }

  function getAssignmentImageFov(assignment) {
    const f = assignment && assignment.image && assignment.image.fov ? assignment.image.fov : null;
    const x = asFiniteNumber(f && f.x);
    const y = asFiniteNumber(f && f.y);
    return {
      x: x && x > 0 ? x : GS_DEFAULT_FOV_X_RAD,
      y: y && y > 0 ? y : GS_DEFAULT_FOV_Y_RAD,
    };
  }

  function drawGsGridOverlay(ctx, w, h, assignment) {
    if (GS_GRID_SPACING_METERS <= 0) return;
    const telemetry = getAssignmentImageTelemetry(assignment);
    if (!telemetry || telemetry.altitude === null || telemetry.altitude <= 0) return;

    const fov = getAssignmentImageFov(assignment);
    const groundWidthMeters = 2 * telemetry.altitude * Math.tan(fov.x / 2);
    const groundHeightMeters = 2 * telemetry.altitude * Math.tan(fov.y / 2);
    if (!Number.isFinite(groundWidthMeters) || !Number.isFinite(groundHeightMeters) || groundWidthMeters <= 0 || groundHeightMeters <= 0) return;

    const pxPerMeterX = w / groundWidthMeters;
    const pxPerMeterY = h / groundHeightMeters;
    const stepX = GS_GRID_SPACING_METERS * pxPerMeterX;
    const stepY = GS_GRID_SPACING_METERS * pxPerMeterY;
    if (!Number.isFinite(stepX) || !Number.isFinite(stepY) || stepX < 4 || stepY < 4) return;

    ctx.save();
    ctx.strokeStyle = 'rgba(0, 180, 255, 0.55)';
    ctx.lineWidth = 1;

    // Draw vertical lines centered on image midpoint
    const cx = w / 2, cy = h / 2;
    for (let x = cx; x <= w; x += stepX) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    for (let x = cx - stepX; x >= 0; x -= stepX) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    }
    // Draw horizontal lines centered on image midpoint
    for (let y = cy; y <= h; y += stepY) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    for (let y = cy - stepY; y >= 0; y -= stepY) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }

    // Optional image center crosshair
    if (GS_SHOW_CROSSHAIR) {
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(w / 2, 0);
      ctx.lineTo(w / 2, h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function createEntryCard(label, data, metaFilename, isBest) {
    const card = document.createElement('div');
    card.className = 'card' + (isBest ? ' highlight' : '');
    const ts = data.timestamp;
    const header = document.createElement('div');
    header.innerHTML = `<div class="timestamp">${fmtTs(ts)}</div>`;
    // Show duplicate count badge on card if present
    try {
      const sig = sigFromData(data);
      if (sig && duplicateCounts[sig] && duplicateCounts[sig] > 0) {
        const badge = document.createElement('span');
        badge.className = 'chip chip-dup';
        badge.textContent = `⟳ ${duplicateCounts[sig]} duplicate${duplicateCounts[sig] === 1 ? '' : 's'}`;
        header.appendChild(badge);
      }
    } catch (e) {}
    card.appendChild(header);

    let imgSrc = `${API_BASE}/export/` + (data.full_image || '');
    // Prefer inline base64 data if provided by the server to avoid extra fetch races
    if (data.full_image_b64) {
      imgSrc = data.full_image_b64;
    }
    const canvas = document.createElement('canvas');
    canvas.className = 'entry-canvas';
    canvas.width = 640; canvas.height = 360;
    card.appendChild(canvas);

    const meta = document.createElement('div');
    meta.className = 'meta';
    let html = '';

    const scoreText = (data.score !== undefined && data.score !== null) ? data.score.toFixed(3) : 'N/A';
    html += '<div class="chips">';
    html += `<span class="chip ${scoreChipClass(data.score)}">★ ${scoreText}</span>`;
    html += `<span class="chip chip-source">${data.model_source || 'unknown'}</span>`;
    html += `<span class="chip chip-id">#${data.assignment_id || 'N/A'}</span>`;
    if (typeof data.since_session_start_ms === 'number' && Number.isFinite(data.since_session_start_ms)) {
      html += `<span class="chip chip-timing">⏱ +${fmtDuration(data.since_session_start_ms)} since first image</span>`;
    }
    html += '</div>';

    if (data._is_cloud_pull || data.gemini_reason) {
      html += '<div class="gemini-reason">' + (data.gemini_reason || 'N/A') + '</div>';
    }

    // Assignment / location details (if available)
    try {
      const a = data.assignment || null;
      if (a) {
        if (a.telemetry) {
          const t = a.telemetry;
          html += '<div class="loc-grid">' +
                  '<div><span class="k">LAT</span><span class="v">' + (t.latitude !== undefined ? t.latitude : 'N/A') + '</span></div>' +
                  '<div><span class="k">LON</span><span class="v">' + (t.longitude !== undefined ? t.longitude : 'N/A') + '</span></div>' +
                  '<div><span class="k">ALT</span><span class="v">' + (t.altitude !== undefined ? t.altitude : 'N/A') + '</span></div>' +
                  '<div><span class="k">YAW</span><span class="v">' + (t.yaw !== undefined ? t.yaw : 'N/A') + '</span></div>' +
                  '</div>';
        } else {
          html += '<details class="assignment"><summary>Raw assignment</summary><pre>' + JSON.stringify(a, null, 2) + '</pre></details>';
        }
      }
    } catch (e) {}
    meta.innerHTML = html;
    card.appendChild(meta);

    // Load image and draw bbox
    const img = new Image();
    img.onload = () => {
      const ctx = canvas.getContext('2d');
      const ratio = img.naturalWidth / img.naturalHeight;
      const w = Math.min(800, img.naturalWidth);
      const h = Math.round(w / ratio);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      if (data.bbox && data.bbox.length === 4) {
        const [x1,y1,x2,y2] = data.bbox;
        const scaleX = w / img.naturalWidth;
        const scaleY = h / img.naturalHeight;
        ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2;
        ctx.strokeRect(x1*scaleX, y1*scaleY, (x2-x1)*scaleX, (y2-y1)*scaleY);
      }
    };
    img.onerror = () => {
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a212b'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#8b96a5'; ctx.font = '13px sans-serif'; ctx.fillText('Image load failed', 12, 22);
    };
    img.src = imgSrc;

    return card;
  }

  async function refresh() {
    const best = await fetchBest();
    if (!best) return;
    const tentLog = document.getElementById('log-tent');
    const manLog = document.getElementById('log-mannequin');
    tentLog.innerHTML = '';
    manLog.innerHTML = '';

    const tentList = best.tent || [];
    const manList = best.mannequin || [];

    // Use explicit to_send fields only (guaranteed to match send_result logic)
    const currentBestTent = best.to_send_tent_meta || null;
    const currentBestMan = best.to_send_mannequin_meta || null;

    // Cloud-pulled bests (in-memory result_store entries)
    const cloudTent = best.cloud_tent || null;
    const cloudMan = best.cloud_mannequin || null;

    function appendFiltered(list, container, labelName, currentBestMeta) {
      const filtered = list.filter(e => (e.pushed === true) || (e.model_source === 'gd_backup'));
      let renderedCount = 0;

      // Find the exact meta that's being sent (if present in the full list)
      let bestInList = null;
      if (currentBestMeta) {
        bestInList = list.find(e => (e._meta_filename || null) === currentBestMeta) || null;
      }

        // If a cloud-pulled best exists for this label, render it first (it overrides GD backup)
        let cloudBest = null;
        if (labelName === 'tent' && cloudTent) cloudBest = cloudTent;
        if (labelName === 'mannequin' && cloudMan) cloudBest = cloudMan;

        // If the cloud in-memory best corresponds to an exported meta that we're
        // also about to render, prefer the exported meta and skip the cloud-only
        // card to avoid showing two highlighted entries. If a cloud best exists
        // but has no matching exported meta, render the cloud card (highlighted).
        if (cloudBest) {
          if (currentBestMeta && cloudBest._meta_filename && cloudBest._meta_filename === currentBestMeta) {
            // Exported meta will be rendered below as the pinned best; skip cloud-only card
            cloudBest = null;
          }
        }
        if (cloudBest) {
          const cloudData = {
            timestamp: Date.now(),
            assignment_id: (cloudBest.assignment && cloudBest.assignment.id) || null,
            assignment: cloudBest.assignment || null,
            score: cloudBest.score || null,
            model_source: cloudBest.model_source || 'cloud',
            gemini_reason: cloudBest.gemini_reason || null,
            bbox: cloudBest.bbox || null,
            full_image: null,
            // server may include inline base64 to avoid separate /export fetch
            full_image_b64: cloudBest.full_image_b64 || null,
            roi_image_b64: cloudBest.roi_image_b64 || null,
            since_session_start_ms: cloudBest.since_session_start_ms,
            _is_cloud_pull: true,
          };
          const cloudCard = createEntryCard(labelName + ' (cloud)', cloudData, cloudBest._meta_filename || null, true);
          container.appendChild(cloudCard);
          renderedCount++;
          // Cloud best overrides GD backup pinned entry — don't render the exported pinned entry as well
          bestInList = null;
        }

      if (filtered.length === 0 && !bestInList) {
        if (renderedCount === 0) {
          container.innerHTML = '<div class="empty">No ' + labelName + ' images to show</div>';
        }
        updateCount(labelName, renderedCount);
        return;
      }

      // If we have a best meta, render it first (pinned to top) and remove it from the remainder
      if (bestInList) {
        const idx = filtered.findIndex(e => (e._meta_filename || null) === currentBestMeta);
        if (idx >= 0) filtered.splice(idx, 1);
        container.appendChild(createEntryCard(labelName, bestInList, bestInList._meta_filename || null, true));
        renderedCount++;
      }

      // Render the remainder (non-highlighted)
      for (const e of filtered) {
        // Skip exported meta entries that duplicate the in-memory cloud-pulled best
        if (cloudBest && cloudBest._meta_filename && e._meta_filename && cloudBest._meta_filename === e._meta_filename) {
          continue;
        }
        container.appendChild(createEntryCard(labelName, e, e._meta_filename || null, false));
        renderedCount++;
      }
      updateCount(labelName, renderedCount);
    }

    appendFiltered(tentList, tentLog, 'tent', currentBestTent);
    appendFiltered(manList, manLog, 'mannequin', currentBestMan);

    // Render the most recent raw image pulled from the imaging GS (served under best.gs)
    const gsPanel = document.getElementById('gs-panel');
    gsPanel.innerHTML = '';
    try {
      const gsList = best.gs || [];
      updateCount('gs', gsList.length);
      if (gsList.length === 0) {
        gsPanel.innerHTML = '<div class="empty">No recent ground-station pulls</div>';
      } else {
        const latest = gsList[0];
        // Build a minimal GS card: image + assignment only
        const card = document.createElement('div');
        card.className = 'gs-card';
        const tsDiv = document.createElement('div');
        tsDiv.className = 'timestamp';
        tsDiv.textContent = fmtTs(latest.timestamp);
        card.appendChild(tsDiv);

        const img = new Image();
        const canvas = document.createElement('canvas');
        canvas.className = 'entry-canvas';
        canvas.width = 320; canvas.height = 180;
        card.appendChild(canvas);
        img.onload = () => {
          const ctx = canvas.getContext('2d');
          const ratio = img.naturalWidth / img.naturalHeight;
          const w = Math.min(320, img.naturalWidth);
          const h = Math.round(w / ratio);
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          drawGsGridOverlay(ctx, w, h, latest.assignment || null);
        };
        img.onerror = () => {
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#1a212b'; ctx.fillRect(0,0,canvas.width,canvas.height);
        };
        img.src = `${API_BASE}/export/` + (latest.full_image || '');

        // Grid legend (key)
        const legendDiv = document.createElement('div');
        legendDiv.className = 'gs-legend';
        legendDiv.innerHTML =
          '<div class="legend-title">Key</div>' +
          '<div class="legend-row">' +
            '<div><span class="legend-swatch" style="border-color:rgba(0,180,255,0.85)"></span>Every ' + GS_GRID_SPACING_METERS + ' m on ground</div>' +
            '<div><span class="legend-swatch" style="border-color:rgba(255,215,0,0.95)"></span>Image center crosshair</div>' +
          '</div>';
        card.appendChild(legendDiv);

        // Location block (lat/lon)
        try {
          const telemetry = getAssignmentImageTelemetry(latest.assignment || null);
          const lat = telemetry ? telemetry.lat : null;
          const lon = telemetry ? telemetry.lon : null;
          const altitude = telemetry ? telemetry.altitude : null;

          const locDiv = document.createElement('div');
          locDiv.className = 'gs-loc';
          locDiv.innerHTML = '<div class="label-sm">Location</div>' +
                             '<div class="hero-row">' +
                               '<div>' +
                                 '<div class="hero-key">LAT</div>' +
                                 '<div class="hero-val">' + (lat !== null ? lat.toFixed(6) : 'N/A') + '</div>' +
                               '</div>' +
                               '<div>' +
                                 '<div class="hero-key">LON</div>' +
                                 '<div class="hero-val">' + (lon !== null ? lon.toFixed(6) : 'N/A') + '</div>' +
                               '</div>' +
                             '</div>' +
                             '<div class="alt-row">Alt: ' + (altitude !== null ? altitude.toFixed(1) + ' m' : 'N/A') + '</div>';
          card.appendChild(locDiv);
        } catch (e) { console.error('Error rendering location:', e); }

        // Assignment block (minimal)
        const assignDiv = document.createElement('div');
        assignDiv.className = 'assignment';
        assignDiv.innerHTML = '<details><summary>Raw assignment</summary><pre>' + JSON.stringify(latest.assignment || {}, null, 2) + '</pre></details>';
        card.appendChild(assignDiv);

        gsPanel.appendChild(card);
      }
    } catch (e) {
      gsPanel.innerHTML = '<div class="empty">Error loading GS image</div>';
    }
  }

  // Grid spacing control
  try {
    const gsSpacingSelect = document.getElementById('gs-grid-spacing');
    const gsShowCrosshair = document.getElementById('gs-show-crosshair');
    if (gsSpacingSelect) {
      const initial = Number(gsSpacingSelect.value);
      if (Number.isFinite(initial) && initial > 0) GS_GRID_SPACING_METERS = initial;
      gsSpacingSelect.addEventListener('change', () => {
        const v = Number(gsSpacingSelect.value);
        if (Number.isFinite(v) && v > 0) {
          GS_GRID_SPACING_METERS = v;
          refresh();
        }
      });
    }
    if (gsShowCrosshair) {
      GS_SHOW_CROSSHAIR = !!gsShowCrosshair.checked;
      gsShowCrosshair.addEventListener('change', () => {
        GS_SHOW_CROSSHAIR = !!gsShowCrosshair.checked;
        refresh();
      });
    }
  } catch (e) { console.warn('Grid spacing control unavailable', e); }

  // Admin actions: clear cloud server / delete local saved images
  async function runAdminCommand(command, confirmMessage, button, { refreshOnSuccess = true } = {}) {
    if (confirmMessage && !confirm(confirmMessage)) return;
    const statusEl = document.getElementById('admin-status');
    statusEl.className = 'action-status';
    statusEl.textContent = 'Working...';
    button.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command }),
      });
      const data = await res.json();
      if (res.ok && data.status === 'success') {
        statusEl.className = 'action-status success';
        statusEl.textContent = data.message || 'Done';
        if (refreshOnSuccess) refresh();
      } else {
        statusEl.className = 'action-status error';
        statusEl.textContent = data.message || `Request failed (${res.status})`;
      }
    } catch (e) {
      statusEl.className = 'action-status error';
      statusEl.textContent = `Request failed: ${e}`;
    } finally {
      button.disabled = false;
    }
  }

  const btnCheckCloud = document.getElementById('btn-check-cloud');
  if (btnCheckCloud) {
    btnCheckCloud.addEventListener('click', () => {
      runAdminCommand('check_cloud', null, btnCheckCloud, { refreshOnSuccess: false });
    });
  }

  const btnClearCloud = document.getElementById('btn-clear-cloud');
  if (btnClearCloud) {
    btnClearCloud.addEventListener('click', () => {
      runAdminCommand(
        'clear_cloud',
        'Clear the cloud server’s in-memory best images and mapping queue? This cannot be undone.',
        btnClearCloud,
      );
    });
  }

  const btnClearExports = document.getElementById('btn-clear-exports');
  if (btnClearExports) {
    btnClearExports.addEventListener('click', () => {
      runAdminCommand(
        'clear_exports',
        'Delete all locally saved images and metadata in ./exports? This cannot be undone.',
        btnClearExports,
      );
    });
  }

  refresh();
  setInterval(refresh, 10000);

  // Live updates via Server-Sent Events: refresh on GS pulls or other events
  try {
    const sseDot = document.getElementById('sse-dot');
    const sseLabel = document.getElementById('sse-label');
    const es = new EventSource(`${API_BASE}/api/stream`);
    es.addEventListener('gs_pull', (e) => {
      try { refresh(); } catch (err) { console.error('refresh failed', err); }
    });
    es.addEventListener('duplicate', (e) => {
      try {
        const data = JSON.parse(e.data || '{}');
        const sig = sigFromData(data);
        if (sig) {
          duplicateCounts[sig] = (duplicateCounts[sig] || 0) + 1;
        }
        try { refresh(); } catch (err) {}
      } catch (err) { console.error('duplicate event parse', err); }
    });
    es.onopen = () => {
      console.log('SSE connected');
      if (sseDot) { sseDot.className = 'status-dot ok'; }
      if (sseLabel) { sseLabel.textContent = 'live'; }
    };
    es.onerror = (err) => {
      console.warn('SSE error', err);
      if (sseDot) { sseDot.className = 'status-dot err'; }
      if (sseLabel) { sseLabel.textContent = 'reconnecting…'; }
    };
  } catch (e) {
    console.warn('SSE not available');
  }
</script>
